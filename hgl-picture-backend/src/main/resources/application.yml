server:
  port: 8123
  servlet:
    context-path: /hgl # 项目访问路径(上下文路径)
    session:
      # cookie 30 天过期
      cookie:
        max-age: 2592000

spring:
  # 配置环境使用本地的配置，或者去Edit Configuration中修改
  profiles:
    active: local
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
  application:
    name: hgl-picture-backend

  # 空间图片分表
  shardingsphere:
    datasource:
      names: hgl_picture
      hgl_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/hgl_picture
        username: root
        password: 123456
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: hgl_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId  # 分片列
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED #  使用类级分片
            props:
              strategy: standard #  标准分片
              algorithmClassName: com.hgl.hglpicturebackend.manager.sharding.PictureShardingAlgorithm  # 分片算法
    props:
      sql-show: true

  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hgl_picture
    username: root
    password: 123456
  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # session配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false # 开启驼峰命名
    # 开启日志(仅在开发环境下开启)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印sql
  # 全局配置
  global-config:
    db-config:
      logic-delete-field: isDeleted # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true # 开启sql运行器
knife4j:
  enable: true
  openapi:
    title: 云图库接口文档
    # 联系人信息
    concat: 请别把我整破防
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.hgl.hglpicturebackend.controller

